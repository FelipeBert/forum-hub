name: Build and Push CI Platform

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
  
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'

  workflow_dispatch:

concurrency:
    group: terraform-${{ github.ref }}
    cancel-in-progress: false

permissions:
    id-token: write
    contents: read
  
jobs:
  terraform-plan:
    name: terraform plan
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (Plan)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TERRAFORM_PLAN }}
          aws-region: ${{ vars.REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Format
        run: terraform fmt -check
        continue-on-error: false

      - name: Terraform Init
        run: terraform init
      
      - name: Terraform Validate
        run: terraform validate
      
      - name: Generate tfvars
        env:
          PUBLIC_SUBNETS_CIDR: ${{ vars.PUBLIC_SUBNETS_CIDR }}
          PRIVATE_SUBNETS_CIDR: ${{ vars.PRIVATE_SUBNETS_CIDR }}
        run: |
          printf 'public_subnets_cidr = %s\n' "$PUBLIC_SUBNETS_CIDR" > terraform.tfvars
          printf 'private_subnets_cidr = %s\n' "$PRIVATE_SUBNETS_CIDR" >> terraform.tfvars

      - name: Terraform Plan
        env:
          TF_VAR_region: ${{ vars.REGION }}
          TF_VAR_ip_admin: ${{ secrets.IP_ADMIN }}
          TF_VAR_vpc_cidr: ${{ vars.VPC_CIDR }}
        run: terraform plan -out=tfplan
      
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1

  terraform-apply:
    name: terraform apply
    needs: terraform-plan
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: production

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (Apply)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TERRAFORM_APPLY }}
          aws-region: ${{ vars.REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/
      
      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan