name: Build and Push CI Platform

on:
  push:
    branches:
      - test-oidc
    # paths:
      # - 'terraform/**'
  
  pull_request:
    branches:
      - test-oidc
    # paths:
      # - 'terraform/**'

  workflow_dispatch:

concurrency:
    group: terraform-${{ github.ref }}
    cancel-in-progress: false

permissions:
    id-token: write
    contents: read
  
jobs:
  terraform-plan:
    name: terraform plan
    runs-on: ubuntu-latest
    environment: test
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (Plan)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::742875367683:role/TestPolicie
          aws-region: sa-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Format
        run: terraform fmt -check
        continue-on-error: false

      - name: Terraform Init
        run: terraform init
      
      - name: Terraform Validate
        run: terraform validate
      
      - name: Terraform Plan
        env:
          TF_VAR_region: ${{ vars.REGION }}
          TF_VAR_ip_admin: ${{ secrets.IP_ADMIN }}
          TF_VAR_vpc_cidr: ${{ vars.VPC_CIDR }}
        run: |
          terraform plan -out=tfplan \
          -var="public_subnets_cidr=${{ vars.PUBLIC_SUBNETS_CIDR }}" \
          -var="private_subnets_cidr=${{ vars.PRIVATE_SUBNETS_CIDR }}"
      
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1

  terraform-apply:
    name: terraform apply
    needs: terraform-plan
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/test-oidc'

    environment: test

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (Plan)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::742875367683:role/TestPolicie
          aws-region: sa-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/
      
      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan